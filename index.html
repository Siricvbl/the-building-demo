<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大楼 · 第一幕：电梯循环</title>
<link rel="preload" as="image" href="images/scenes/scene_title.webp">
<link rel="preload" as="image" href="images/scenes/scene_lobby.webp">
<link rel="preload" as="image" href="images/scenes/scene_elevator.webp">
<link rel="preload" as="image" href="images/scenes/scene_stairs.webp">
<link rel="preload" as="image" href="images/scenes/scene_death.webp">
<link rel="preload" as="image" href="images/scenes/scene_boy_end.webp">
<link rel="preload" as="audio" href="audio/kunju.mp3">
<link rel="preload" as="audio" href="audio/weizhi.mp3">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#0f0f14;--bg-deep:#08080c;--gold:#b98a38;--gold-bright:#d4a84a;--text:#e8e4dc;--text-dim:#8a857c;--blood:#8b1a1a;--blood-bright:#c0392b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:"Songti SC","STSong","SimSun","宋体","Noto Serif SC",serif;font-size:22px;min-height:100vh;overflow-x:hidden;transition:background 0.8s ease}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.55) 100%);z-index:1}
body.scene-title{background:radial-gradient(ellipse at 30% 40%,rgba(26,21,16,0.7),rgba(15,15,20,0.85) 50%,rgba(8,8,12,0.95)),url('images/scenes/scene_title.webp') center/cover no-repeat fixed}
body.scene-lobby{background:radial-gradient(ellipse at 50% 50%,rgba(20,18,16,0.75),rgba(15,15,20,0.85) 50%,rgba(8,8,12,0.95)),url('images/scenes/scene_lobby.webp') center/cover no-repeat fixed}
body.scene-elevator{background:radial-gradient(ellipse at 50% 30%,rgba(18,20,26,0.75),rgba(10,12,18,0.85) 50%,rgba(6,8,12,0.95)),url('images/scenes/scene_elevator.webp') center/cover no-repeat fixed}
body.scene-stairs{background:radial-gradient(ellipse at 50% 50%,rgba(16,16,18,0.75),rgba(10,10,12,0.85) 50%,rgba(5,5,5,0.95)),url('images/scenes/scene_stairs.webp') center/cover no-repeat fixed}
body.scene-death{background:radial-gradient(ellipse at 50% 50%,rgba(26,5,5,0.75),rgba(15,2,2,0.85) 50%,rgba(0,0,0,0.95)),url('images/scenes/scene_death.webp') center/cover no-repeat fixed}
body.scene-boy{background:radial-gradient(ellipse at 50% 60%,rgba(26,18,8,0.75),rgba(15,10,4,0.85) 50%,rgba(0,0,0,0.95)),url('images/scenes/scene_boy_end.webp') center/cover no-repeat fixed}
#title-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,rgba(26,21,16,0.7),rgba(15,15,20,0.88) 60%,rgba(8,8,12,0.96)),url('images/scenes/scene_title.webp') center/cover no-repeat;transition:opacity 0.6s}
#title-screen.hidden{opacity:0;pointer-events:none}
#title-screen h1{font-size:48px;color:var(--gold);letter-spacing:12px;margin-bottom:8px;text-shadow:0 0 20px rgba(185,138,56,0.3)}
#title-screen p{color:var(--text-dim);font-size:18px;letter-spacing:3px;margin-bottom:40px}
#start-btn{font-family:inherit;font-size:22px;color:var(--text);background:transparent;border:1px solid var(--gold);padding:12px 48px;cursor:pointer;letter-spacing:4px;transition:all 0.3s}
#start-btn:hover{background:rgba(185,138,56,0.15);color:var(--gold-bright)}
#game{position:relative;z-index:2;max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:24px 22px 48px}
header.loop-bar{text-align:center;color:var(--gold);font-size:18px;letter-spacing:5px;padding:6px 0 20px;border-bottom:1px solid rgba(185,138,56,0.18);margin-bottom:26px;min-height:20px;display:flex;justify-content:space-between;align-items:center}
header.loop-bar .floor-info{color:var(--text-dim)}
#narrative{flex:1;line-height:1.95;letter-spacing:1.2px;white-space:pre-wrap;min-height:220px;text-shadow:0 0 8px rgba(0,0,0,0.6)}
#narrative p{margin-bottom:0.8em}
#choices{display:flex;flex-direction:column;gap:12px;margin-top:20px}
button.choice{font-family:inherit;font-size:22px;color:var(--text);background:rgba(15,15,20,0.8);border:1px solid rgba(185,138,56,0.3);padding:14px 28px;cursor:pointer;letter-spacing:2px;text-align:left;transition:all 0.2s;border-radius:2px}
button.choice:hover{border-color:var(--gold);background:rgba(185,138,56,0.1);color:var(--gold-bright)}
.panel-wrap{margin-top:16px}
.panel-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:600px}
.panel-btn{font-family:inherit;font-size:20px;color:var(--text);background:rgba(20,20,28,0.9);border:1px solid rgba(185,138,56,0.2);padding:12px 0;cursor:pointer;text-align:center;border-radius:2px;transition:all 0.15s}
.panel-btn:hover{border-color:var(--gold);background:rgba(185,138,56,0.1)}
.panel-btn.glow20{box-shadow:0 0 8px rgba(139,26,26,0.4);border-color:rgba(139,26,26,0.3)}
.panel-btn.crack{animation:crack 0.3s}
.panel-btn:disabled{opacity:0.3;pointer-events:none}
.hint{color:var(--text-dim);font-size:18px;margin-top:12px;text-align:center}
@keyframes crack{0%{transform:scale(1)}50%{transform:scale(1.1);background:rgba(139,26,26,0.5)}100%{transform:scale(0.95)}}
.shaking{animation:shake 0.4s infinite}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
.dying{filter:blur(3px) brightness(0.3);transition:filter 1s}
.end-title{font-size:32px;color:var(--gold);text-align:center;letter-spacing:8px;margin:40px 0}
#audio-toggle{position:fixed;top:16px;right:16px;z-index:50;font-size:20px;cursor:pointer;background:rgba(15,15,20,0.8);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:6px 10px;color:var(--text)}
#debug-panel{position:fixed;bottom:16px;right:16px;z-index:50;background:rgba(8,8,12,0.95);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:12px;font-size:14px;color:var(--text-dim);max-width:280px;display:none}
#debug-panel.visible{display:block}
#debug-panel h3{color:var(--gold);font-size:14px;margin-bottom:8px}
#debug-panel .dbg-btn{font-size:14px;padding:4px 8px;margin:2px;cursor:pointer;background:rgba(185,138,56,0.1);border:1px solid rgba(185,138,56,0.3);color:var(--text);border-radius:2px}
#debug-panel .dbg-btn:hover{background:rgba(185,138,56,0.2)}
#debug-toggle{position:fixed;bottom:16px;right:16px;z-index:51;font-size:14px;cursor:pointer;background:rgba(8,8,12,0.8);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:4px 8px;color:var(--gold)}

/* —— 死亡仪式弹窗 —— */
#death-overlay{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(26,5,5,0.8) 0%,rgba(10,2,2,0.92) 50%,rgba(0,0,0,1) 100%),url('images/scenes/scene_death.webp') center/cover no-repeat;opacity:0;transition:opacity 0.8s}
#death-overlay.visible{display:flex;opacity:1}
#death-overlay .death-label{font-size:18px;color:var(--text-dim);letter-spacing:6px;margin-bottom:12px;opacity:0;animation:fadeUp 0.8s 0.3s forwards}
#death-overlay .death-name{font-size:42px;color:var(--blood-bright);letter-spacing:10px;text-shadow:0 0 30px rgba(192,57,43,0.5);opacity:0;animation:fadeUp 1s 0.6s forwards;margin-bottom:20px}
#death-overlay .death-loop{font-size:18px;color:var(--gold);letter-spacing:4px;opacity:0;animation:fadeUp 0.8s 1.2s forwards;margin-bottom:30px}
#death-overlay .unlock-badge{font-size:20px;color:var(--gold-bright);border:1px solid var(--gold);padding:8px 24px;letter-spacing:3px;opacity:0;animation:fadeUp 0.8s 1.6s forwards;margin-bottom:30px;border-radius:2px;text-shadow:0 0 10px rgba(212,168,74,0.3)}
#death-overlay .death-btn{font-family:inherit;font-size:22px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;letter-spacing:4px;opacity:0;animation:fadeUp 0.8s 2.2s forwards;transition:color 0.2s;margin-top:10px}
#death-overlay .death-btn:hover{color:var(--gold)}
#death-overlay .death-divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--blood),transparent);opacity:0;animation:fadeUp 0.8s 0.9s forwards;margin-bottom:20px}
#death-overlay .death-art{width:220px;height:220px;object-fit:cover;border-radius:4px;border:1px solid rgba(185,138,56,0.3);opacity:0;animation:fadeUp 1s 0.3s forwards;margin-bottom:20px;box-shadow:0 0 30px rgba(0,0,0,0.8)}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* —— 循环图鉴 —— */
#codex-overlay{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:radial-gradient(ellipse at 30% 20%,rgba(18,17,10,0.88),rgba(15,15,20,0.92) 50%,rgba(8,8,12,0.98)),url('images/scenes/scene_title.webp') center/cover no-repeat fixed;overflow-y:auto}
#codex-overlay.visible{display:flex}
#codex-overlay .codex-header{text-align:center;padding:30px 20px 10px;flex-shrink:0}
#codex-overlay .codex-header h2{font-size:32px;color:var(--gold);letter-spacing:8px;margin-bottom:6px}
#codex-overlay .codex-header p{color:var(--text-dim);font-size:18px;letter-spacing:2px}
#codex-overlay .codex-progress{color:var(--gold);font-size:20px;margin-top:8px}
#codex-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px 30px 40px;max-width:800px;margin:0 auto;width:100%}
.codex-cell{aspect-ratio:1;border:1px solid rgba(185,138,56,0.15);background:rgba(8,8,12,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:2px;padding:8px;text-align:center;transition:all 0.2s;position:relative;overflow:hidden}
.codex-cell.unlocked{border-color:rgba(185,138,56,0.4);background-size:cover;background-position:center}
.codex-cell.unlocked .cell-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,8,12,0.2) 0%,rgba(8,8,12,0.82) 65%,rgba(8,8,12,0.95) 100%)}
.codex-cell.unlocked .cell-num,.codex-cell.unlocked .cell-name{position:relative;z-index:1}
.codex-cell.unlocked:hover{border-color:var(--gold);transform:scale(1.05)}
.codex-cell.unlocked:hover .cell-overlay{background:linear-gradient(to bottom,rgba(8,8,12,0.05) 0%,rgba(8,8,12,0.6) 65%,rgba(8,8,12,0.88) 100%)}
.codex-cell .cell-num{font-size:14px;color:var(--text-dim);margin-bottom:4px}
.codex-cell.unlocked .cell-num{color:var(--gold)}
.codex-cell .cell-name{font-size:16px;color:var(--text-dim);line-height:1.3}
.codex-cell.unlocked .cell-name{color:var(--text)}
.codex-cell.locked .cell-name{color:rgba(138,133,124,0.3)}
#codex-close{position:fixed;top:16px;right:16px;z-index:201;font-size:22px;cursor:pointer;background:rgba(15,15,20,0.8);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:6px 12px;color:var(--text)}
#codex-close:hover{border-color:var(--gold);color:var(--gold)}
/* —— 结算页面 —— */
#settlement-overlay{position:fixed;inset:0;z-index:210;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(26,21,16,0.85),rgba(15,15,20,0.95) 50%,rgba(8,8,12,0.98)),url('images/scenes/scene_boy_end.webp') center/cover no-repeat fixed;overflow-y:auto}
#settlement-overlay.visible{display:flex;animation:fadeIn 0.8s}
#settlement-content{max-width:800px;width:100%;padding:40px 30px;text-align:center}
.settlement-title{font-size:36px;color:var(--gold);letter-spacing:12px;margin-bottom:6px;text-shadow:0 0 20px rgba(185,138,56,0.3)}
.settlement-subtitle{font-size:18px;color:var(--text-dim);letter-spacing:4px;margin-bottom:24px}
.settlement-progress-wrap{margin-bottom:28px}
.settlement-count{font-size:64px;color:var(--gold-bright);font-weight:bold;text-shadow:0 0 30px rgba(212,168,74,0.4)}
.settlement-total{font-size:28px;color:var(--text-dim);margin-left:4px}
.settlement-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:32px}
.settlement-grid .codex-cell{aspect-ratio:1}
.settlement-actions{display:flex;flex-direction:column;align-items:center;gap:14px}
.settlement-btn{font-family:inherit;font-size:22px;cursor:pointer;letter-spacing:4px;padding:12px 48px;border-radius:2px;transition:all 0.2s}
.settlement-btn.save{color:var(--gold);background:rgba(15,15,20,0.8);border:1px solid var(--gold)}
.settlement-btn.save:hover{background:rgba(185,138,56,0.15);color:var(--gold-bright)}
.settlement-btn.continue{color:var(--text-dim);background:transparent;border:1px solid rgba(138,133,124,0.3)}
.settlement-btn.continue:hover{border-color:var(--text-dim);color:var(--text)}
.settlement-warning{font-size:16px;color:var(--text-dim);letter-spacing:2px;opacity:0.6;margin-top:4px}

/* —— 标题画面图鉴按钮 —— */
#codex-btn-title{font-family:inherit;font-size:18px;color:var(--text-dim);background:transparent;border:1px solid rgba(185,138,56,0.2);padding:8px 24px;cursor:pointer;letter-spacing:3px;margin-top:16px;transition:all 0.3s}
#codex-btn-title:hover{border-color:var(--gold);color:var(--gold-bright)}

#click-hint{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:40;color:var(--text-dim);font-size:16px;letter-spacing:3px;opacity:0;transition:opacity 0.5s;pointer-events:none;animation:pulse 2s infinite}
#click-hint.visible{opacity:0.6}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.7}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* —— 左上角汉堡菜单 —— */
#menu-btn{position:fixed;top:16px;left:16px;z-index:50;font-size:20px;cursor:pointer;background:rgba(15,15,20,0.8);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:6px 12px;color:var(--gold);transition:all 0.2s}
#menu-btn:hover{border-color:var(--gold);background:rgba(185,138,56,0.1)}
#menu-panel{position:fixed;top:52px;left:16px;z-index:50;background:rgba(8,8,12,0.97);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:8px;min-width:180px;display:none;flex-direction:column;gap:2px}
#menu-panel.visible{display:flex}
.menu-item{font-family:inherit;font-size:18px;color:var(--text);background:transparent;border:none;cursor:pointer;padding:10px 16px;text-align:left;letter-spacing:2px;border-radius:2px;transition:all 0.15s}
.menu-item:hover{background:rgba(185,138,56,0.1);color:var(--gold-bright)}
.menu-sep{height:1px;background:rgba(185,138,56,0.15);margin:4px 8px}
.menu-label{font-size:14px;color:var(--text-dim);padding:4px 16px;letter-spacing:1px}
.menu-slider-row{display:flex;align-items:center;gap:8px;padding:6px 16px}

/* —— 存档面板 —— */
#save-overlay{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:radial-gradient(ellipse at 30% 20%,#12110a,#0f0f14 50%,#08080c);overflow-y:auto}
#save-overlay.visible{display:flex}
#save-slots{padding:20px 30px 40px;max-width:600px;margin:0 auto;width:100%}
.save-slot{border:1px solid rgba(185,138,56,0.2);background:rgba(8,8,12,0.6);padding:20px;margin-bottom:12px;border-radius:2px;transition:all 0.2s}
.save-slot:hover{border-color:rgba(185,138,56,0.4)}
.save-slot.empty{border-style:dashed}
.save-slot-info{flex:1}
.save-slot-name{font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.save-slot-detail{font-size:16px;color:var(--text-dim);line-height:1.5}
.save-slot-actions{display:flex;gap:8px;margin-top:12px}
.save-slot-btn{font-family:inherit;font-size:16px;padding:6px 16px;cursor:pointer;background:rgba(185,138,56,0.1);border:1px solid rgba(185,138,56,0.3);color:var(--text);border-radius:2px;transition:all 0.15s}
.save-slot-btn:hover{background:rgba(185,138,56,0.2);border-color:var(--gold)}
.save-slot-btn.danger{border-color:rgba(139,26,26,0.3);color:var(--blood-bright)}
.save-slot-btn.danger:hover{background:rgba(139,26,26,0.15)}
#save-close{position:fixed;top:16px;right:16px;z-index:201;font-size:22px;cursor:pointer;background:rgba(15,15,20,0.8);border:1px solid rgba(185,138,56,0.3);border-radius:4px;padding:6px 12px;color:var(--text)}
#save-close:hover{border-color:var(--gold);color:var(--gold)}
</style>
<script>/* preload all game images at page load */
(function(){var imgs=['characters/char_badge','characters/char_boy','characters/char_coffee','characters/char_elderly','characters/char_hooded','characters/char_susu'];for(var i=1;i<=24;i++){var s=String(i).padStart(2,'0');imgs.push('deaths/death_'+s);}imgs.forEach(function(p){var im=new Image();im.src='images/'+p+'.webp';});})();
</script>
</head>
<body>
<div id="title-screen"><h1>大楼</h1><p>第一幕 · 电梯循环</p><button id="start-btn">开始游戏</button><button id="codex-btn-title">循环图鉴</button></div>
<div id="game"><header class="loop-bar"><span id="loopBar"></span><span id="floorInfo" class="floor-info"></span></header><main class="stage"><div id="narrative"></div><div id="choices"></div></main></div>
<div id="click-hint">点击继续 ▸</div>
<button id="menu-btn">☰</button>
<div id="menu-panel">
  <div class="menu-label">循环第 <span id="menu-loop">1</span> 次</div>
  <div class="menu-sep"></div>
  <button class="menu-item" onclick="Audio.click();showDeathCodex()">📖 循环图鉴</button>
  <button class="menu-item" onclick="Audio.click();showSavePanel()">💾 存档 / 读档</button>
  <div class="menu-sep"></div>
  <button class="menu-item" onclick="Audio.click();returnToTitle()">🏠 返回标题</button>
  <button class="menu-item" onclick="Audio.click();confirmReset()">🗑 重置存档</button>
  <div class="menu-sep"></div>
  <div class="menu-label">音效</div>
  <button class="menu-item" id="menu-audio-toggle" onclick="toggleAudioFromMenu()">🔊 开启</button>
  <div class="menu-slider-row"><span style="font-size:14px;color:var(--text-dim)">音量</span><input type="range" id="menu-volume" min="0" max="100" value="60" style="flex:1;accent-color:var(--gold)" oninput="setVolume(this.value)"></div>
  <div class="menu-sep"></div>
  <div class="menu-label" style="display:none">调试</div>
  <button class="menu-item" style="display:none" onclick="Audio.click();DBG.forceBoy()">⚡ 强制少年</button>
  <button class="menu-item" style="display:none" onclick="Audio.click();DBG.skipTo31()">⏩ 跳到循环31</button>
  <button class="menu-item" style="display:none" onclick="Audio.click();DBG.showDeathPicker()">🎯 触发指定死法</button>
</div>
<button id="audio-toggle" style="display:none">🔊</button>
<button id="debug-toggle" style="display:none">🔧</button>
<div id="debug-panel" style="display:none"></div>
<div id="death-overlay"></div>
<div id="codex-overlay"><button id="codex-close">✕</button><div class="codex-header"><h2>循环图鉴</h2><p>每一種循环，都是一條出路</p><div class="codex-progress" id="codex-progress"></div></div><div id="codex-grid"></div></div>
<div id="save-overlay"><button id="save-close">✕</button><div class="codex-header"><h2>存档 / 读档</h2><p>选择一个存档位进行保存或读取</p></div><div id="save-slots"></div></div>
<div id="settlement-overlay"><div id="settlement-content"><div class="settlement-title">循环图鉴 · 结算</div><div class="settlement-subtitle">第一幕 · 电梯循环 · 完</div><div class="settlement-progress-wrap"><span class="settlement-count" id="settlement-count">0</span><span class="settlement-total">/24</span></div><div class="settlement-grid" id="settlement-grid"></div><div class="settlement-actions"><button class="settlement-btn save" id="settlement-save-btn">保存留念</button><button class="settlement-btn continue" id="settlement-continue-btn">继续</button><p class="settlement-warning">继续后将清除全部图鉴，重新开始</p></div></div></div>
<script>
const CONFIG={
  loop1:{
    paragraphs:[
      "23:27。\n\n我叫苏苏。\n\n在市中心的广告公司上班，今天又加班到这个时候。",
      "这是一栋老旧的公寓楼，三十层，外墙的瓷砖掉了大半，楼道里的灯忽明忽暗。\n\n但离公司近，月租也便宜，我就租在二十楼。",
      "好累。\n\n回家先洗个热水澡，还有一份方案明天要交。\n\n老板的语音消息还在响，我没点开。",
      "电梯厅的灯是暖黄色的，很旧的那种白炽灯，把墙壁映得发黄。\n\n走廊尽头有一面镜子，镜面裂了一条缝，我每次经过都不太敢看。",
      "我站在电梯门前，按了上行键。\n\n电梯来了。\n\n门开了。",
      "轿厢里的灯管闪了两下才亮。\n\n我走进去，习惯性地伸手去按20。\n\n——咦？\n\n20的按键不在了。",
      "我以为我眼睛花了。\n\n凑近面板仔细看，1到30的按键整整齐齐，唯独20的位置——是一片空白。\n\n不是被抠掉了，就是……从来没有过。\n\n我又看了一遍。\n\n真的没有。",
      "电梯门合拢了。\n\n我还在面板上焦急地找20楼，翻来覆去地找，就是没有。\n\n这时候我才意识到——轿厢在动。\n\n在向上移动。\n\n我明明没有按任何楼层。",
      "显示屏上的数字在跳——15、18、22、25——快到我来不及看清。\n\n28。\n\n29。\n\n30。\n\n还在加速。\n\n头顶的楼板越来越近。\n\n钢缆发出尖锐的嘶鸣。"

  loop2:{
    paragraphs:[
      "电梯厅里灯光昏黄，吊灯在灰色的水泥地板上打出浅浅的影。\n\n好像刚才的一切都是幻觉，除了我的心跳快得要连成一片。",
      "叮！\n\n轿厢门毫无征兆地开启，我下意识后退了一步。\n\n完好无损的轿厢，顶灯的白光有些刺眼，轿厢的镜面映出我毫无血色的脸。",
      "进？\n\n还是不进？\n\n刚才那一切，真的只是幻觉吗？\n\n我努力回想轿厢冲顶时的最后一刻，却突然发现——关于那一刻，我没有任何记忆。\n\n所以……是幻觉……吧。",
      "真的好累了，想回去休息，明早还有项目汇报。\n\n这样想着，我拍了拍脸，告诉自己别胡思乱想，迈开腿向电梯走去。",
      "30个按键整整齐齐，从1到30依次罗列。\n\n我又伸出手指，戳了戳那个20的按键。\n\n银白的光晕亮起。\n\n嚯，没问题。\n\n看来真的是我想多了。",
      "「滴——」超时警报刺入耳膜。\n\n我深吸一口气，身体没入轿厢，按下了关门键。\n\n电梯门缓缓闭合，我的后背不自觉地贴住轿厢壁，看着显示屏上的数字规律跳动。\n\n一切顺利。",
      "我想我真的是太累了，居然会出现那样可怕的幻觉。\n\n我看着镜子里自己的脸庞，年轻，苍白，疲惫，一看就很缺觉。\n\n等我忙过这一阵，我一定要——"

    crashText:"等等！\n\n第20层按键的白色光晕突然开始不规则频闪，像是挣扎又无力般，三秒后彻底熄灭。\n\n！\n\n！\n\n！",
    crashText2:"电梯在坠落。\n\n失重。\n\n灯管在闪烁。\n\n轿厢在自由落体。\n\n我的身体飘了起来，想抓住扶手，手指抓空了。\n\n撞击地面的那一瞬间——"

  loopIntros:{
    r46:"我确信自己陷入了某种奇怪的循环中。\n\n有股神秘力量在阻止我回家。\n\n但我必须上去。\n\n二十楼。\n\n那里是我的家，有我的猫，我的植物，我的生活。\n\n我要回家。",
    r79:"23:27。\n\n该死的。\n\n又回来了。\n\n我死了一次又一次，每次醒来都在这里。\n\n同一个时间，同一盏灯，同一面裂了缝的镜子。\n\n我已经试过了——电梯会冲顶，楼层会杀人，那些\"人\"根本不是人。\n\n但这栋楼不让我走。\n\n楼梯间通向的不是出口，电梯通向的不是家。\n\n每一条路都是死路，每一次死亡都把我送回起点。\n\n我不信邪。\n\n一定有办法。",
    r1012:"23:27。\n\n……这是第几次了？\n\n9次？10次？11 次？\n\n我已经记不太清了。\n\n每次都会重新回到这里。\n\n我想回家。\n\n我是说……真正的回家。\n\n回到正常的、会流逝的时间里面。\n\n这栋楼把我困住了。\n\n像一只巨大的笼子。\n\n我在里面跑来跑去，每次撞到栏杆，就被弹回原点。\n\n我好累。",
    r1315:"23:27。\n\n又是这里。\n\n我已经不害怕了。\n\n害怕是有用的——当你还觉得自己能逃出去的时候。\n\n现在我连害怕都觉得多余。\n\n死过太多次了。\n\n冲顶、坠落、窒息、被拖走……每种循环都体验过。\n\n死亡是真实的，但每次醒来都完好无损，像是身体在嘲笑我。\n\n这栋楼在玩什么游戏？\n\n它想从我这里得到什么？\n\n我不知道。\n\n我什么都不知道了。\n\n我只是……机械地走向电梯。\n\n因为除了前进，我无事可做。",
    r1618:"23:27。\n\n……我在这里站了多久了？\n\n我已经不知道轮回了多少次……我好像有些记不清了……我死过。\n\n我确定我死过。\n\n很多次。\n\n但是具体是怎么死的……那些楼层的细节……那些\"人\"的脸……像是隔着一层毛玻璃。\n\n看得到轮廓，摸不到实体。\n\n如果继续这样下去，我会不会忘掉一切？\n\n等等……我到底循环多少次了？",
    r1921:"23:27。\n\n……灯。\n\n暖黄色的灯。\n\n我站在这里。\n\n为什么站在这里？\n\n好像……回家。\n\n回家，对，回家。\n\n我叫什么来着？\n\n……苏苏，对，我叫苏苏。\n\n我住在……二十楼，二十楼。\n\n我要去二十楼。\n\n我要回家。",

  panelTypes:[
    {id:'no20',prob:0.50,desc:"面板上的按键从1排到30，整整齐齐。\n\n——唯独没有20。\n\n又是这样。\n\n我的手指在面板上反复找了好几遍。\n\n1、2、3……18、19、21、22……20的位置是一片空白，像是从未存在过。\n\n我住在二十楼。\n\n二十楼是我的家。\n\n为什么二十楼会消失？",buttons(){const a=[];for(let i=1;i<=30;i++)if(i!==20)a.push({label:i,floor:i});return a;}},
    {id:'normal',prob:0.10,desc:"面板上的按键从1排到30，整整齐齐。\n\n——20在。\n\n我心里一跳。\n\n二十楼的按键就在那里，安安静静地亮着微弱的光。\n\n之前的循环里，20要么消失，要么出问题。\n\n但这次……它好好地在那里。\n\n像是回家的大门终于打开了。\n\n我应该按吗？",buttons(){const a=[];for(let i=1;i<=30;i++)a.push({label:i,floor:i});return a;}},
    {id:'break20',prob:0.10,desc:"面板上的按键从1排到30，整整齐齐。\n\n20也在。\n\n我按下20。\n\n——按不动。\n\n再按一次。\n\n松松的，像是按键下面空了一截。",buttons(){const a=[];for(let i=1;i<=30;i++)a.push({label:i,floor:i,special:i===20?'break':null});return a;}},
    {id:'shock20',prob:0.10,desc:"面板上的按键从1排到30，整整齐齐。\n\n20也在。\n\n它亮着微弱的光，和其他按键没什么不同。\n\n但我的手指悬在它上方时，汗毛竖了起来。",buttons(){const a=[];for(let i=1;i<=30;i++)a.push({label:i,floor:i,special:i===20?'shock':null});return a;}},
    {id:'scrambled',prob:0.10,desc:"面板上的数字……还在，但顺序全乱了。\n\n3挨着27，15挤在1和28之间。\n\n20不知道被塞到了哪个角落。\n\n我找了一会儿，终于在一个不起眼的位置发现了它。",buttons(){const n=[];for(let i=1;i<=30;i++)n.push(i);for(let i=n.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[n[i],n[j]]=[n[j],n[i]];}return n.map(x=>({label:x,floor:x}));}},
    {id:'symbols',prob:0.10,desc:"面板上没有数字了。\n\n所有的按键都变成了看不懂的符号——像符文，又像虫子爬过的痕迹。\n\n卍、卐、爻、卦、奠、祭……每一个符号背后对应的是哪个楼层？\n\n我完全不知道。\n\n其中有一个符号，按下去会是20楼吗？",buttons(){const s=["卍","卐","爻","卦","奠","祭","禍","煞","冥","殤","亡","魂","魄","靈","柩","喪","哀","慟","殮","蠱","咒","讖","殃","魅","魎","魑","魘","噩","孽","祟"];const f=[];for(let i=1;i<=30;i++)f.push(i);for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]];}return s.map((x,i)=>({label:x,floor:f[i]}));}}

  elevatorEvents:[
    {id:'E1',name:'电梯冲顶',texts:["电梯突然加速了。","不是正常的加速——是那种钢缆断裂、制动失灵的疯狂加速。","我被甩到了地板上。\n\n显示屏上的数字在跳，快到来不及看清。","头顶的楼板越来越近。","30层的天花板。\n\n撞击。"],deathId:5},
    {id:'E2',name:'电梯坠落',texts:["一声闷响。\n\n电梯停住了。","然后——失重。","我的身体飘了起来。\n\n灯管在闪烁，轿厢在自由落体。","胃像被一只手攥住。\n\n我想抓住扶手，但手指抓空了。","撞击地面的那一瞬间，我什么都听不见了。"],deathId:6},
    {id:'E3',name:'电梯门剪切',texts:["门还没关好，电梯就动了。","我正好站在门口——半边身子在轿厢里，半边身子在外面。","门夹住了我的腰。\n\n电梯开始上升。","我被夹在门和门框之间，跟着轿厢一起往上走。"],deathId:7},
    {id:'E5',name:'深渊电梯',texts:["叮。\n\n电梯停了。\n\n门开了。","门外——什么都没有。","没有走廊，没有地砖，没有墙壁。\n\n只有黑暗。\n\n和无底的深渊。","一阵风从下方吹上来，带着腐朽的气味。","我的身体失去了平衡。"],deathId:1},
    {id:'E8',name:'按钮全变红',texts:["面板上所有的按键同时变成了血红色。","我没有碰任何东西。\n\n按键自己在闪烁，像是在传递某种信号。","电梯开始自行运转。\n\n我没有按任何楼层，但它在上升。","显示屏跳出一个数字——它自己选了目的地。","我只能看着。"],deathId:0},

  stairsEvents:[
    {id:'S1',name:'楼梯摔倒',texts:["声控灯又灭了。\n\n我摸黑往上走，脚下踩到了什么——","湿的。\n\n楼梯上有水？","脚一滑。","我翻滚着坠下了楼梯。\n\n后脑勺撞上台阶的棱角，眼前一黑。","然后是持续的坠落。\n\n一层、两层、三层——"],deathId:8},
    {id:'S2',name:'鬼打墙力竭',texts:["我一直在走。","楼梯在向上延伸，我一层一层地爬。\n\n但是——","台阶上的数字在重复。\n\n4、4、4。","不管我爬多少层，标识牌上的数字永远是4。","我的腿像灌了铅。\n\n心跳快得像要从喉咙里蹦出来。","我蹲下来，大口喘气。\n\n然后我听到——","身后有脚步声。\n\n不紧不慢。\n\n一直在跟着我。","我站起来继续跑。\n\n腿已经不听使唤了。","摔倒。\n\n爬起来。\n\n再摔倒。","跑不动了。"],deathId:10},
    {id:'S3',name:'Boss来电',texts:["手机突然响了起来。\n\n来电显示：老板。","我才想起来，对，我带了手机。\n\n老板暴躁的声音从电话那头传来：\n\n「发的语音为什么不回？我让你明天早上八点前把营销策划材料发给我，你看到了吗！」","我却像是抓到了救命稻草。\n\n「老板，你听我说，我被困在一栋楼里了，我出不去，求你帮我报个警！」\n\n「这是你不回复工作消息的理由吗？」\n\n「我真的被困在——」\n\n「这是你不回复工作消息的理由吗？」\n\n又是这句。","「老板？」\n\n「这是你不回复工作消息的理由吗？」\n\n老板的声音逐渐变得阴森扭曲。\n\n不，不对劲。\n\n……\n\n我捂住耳朵。\n\n手机掉在了地上。"],deathId:24}

  boyTrigger:{probTable:[[11,15,0.01],[16,20,0.03],[21,25,0.05],[26,30,0.10]],sequence:["我又站在了电梯轿厢里。\n\n等等，为什么要说「又」？\n\n我把这无端的念头抛到脑后，好吧，这不重要。\n\n重要的是，电梯里，好像有鬼。","不对劲是从电梯停在4楼时开始的。\n\n「叮——」第四层到了。\n\n可我根本没有按这个楼层。","电梯门缓缓打开，门外的寒气袭面而来，我忍不住打了个寒颤。\n\n四楼的走廊上一片死寂，空无一人。","三秒，五秒，十秒过去了，电梯门却丝毫没有要合上的意思，刺耳的警报声在狭小的轿厢里骤然响起。","「电梯是卡住了吗？」\n\n我喃喃自语，伸出手去按关门键，却听到冰冷的电子音提示：「电梯已超载，请后进入的乘客退出。」","与此同时，电梯显示屏上，数字「4」疯狂闪烁，下方「满员」两个鲜红的大字格外刺眼。\n\n我的手刹时僵住。","后颈凉飕飕的，好像有什么东西在吹气，似有若无。\n\n轿厢顶上有液体滴落。\n\n潮湿，黏糊，冰冷，滴落在我的头顶。\n\n我的心猛地一紧，直觉最好不要抬眼看。","然而，五秒后，余光中，一抹暗红顺着我的发尖缓缓滑落，「啪哒」一声，在地板绽出一朵殷红的花。\n\n血！！！\n\n我要疯了。\n\n这电梯绝对没法再呆了！","我在心里暗自数了三个数，然后猛地一跺脚，用尽全身力气跳出轿厢，慌不择路地躲进了旁边的楼梯间，玩儿了命似的向上跑去。","逃跑中，我似乎听到了谁在笑，那声音像指甲划过纸面。\n\n不是幻听！\n\n因为紧接着，楼下传来了高跟鞋爬楼的声音。","咔哒——咔哒——\n\n每一声都仿佛踩在我的心脏上。\n\n快逃！快逃！\n\n我在心里尖叫，可双腿却像灌了铅一样，越来越重。","那声音越来越近，某个恐怖的存在正步步紧逼！\n\n要被追上了吗？\n\n绝望的情绪将我吞没，我几乎放弃挣扎。","突然，黑暗中我被谁大力扯了一把，扯进了楼梯间拐角的暗门里。\n\n一只手捂住了我的嘴。","黑暗中，一个少年的声音贴着我耳边响起——\n\n「别出声。」"],endText:"【第一幕 · 电梯循环 · 完】",endSequence:["一点火光亮起。\n\n蜡烛。\n\n一个少年站在黑暗中，手里举着一根蜡烛。\n\n火光映出他苍白的脸。","他看着我。","「我等你很久了。」"]},

const Audio={ctx:null,enabled:true,volume:0.6,ambientOsc:null,ambientGain:null,heartbeatTimer:null,masterGain:null,init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();this.masterGain=this.ctx.createGain();this.masterGain.gain.value=this.volume;this.masterGain.connect(this.ctx.destination);}catch(e){this.ctx=null;}},_dest(){return this.masterGain||this.ctx.destination;},setVolume(v){this.volume=v;if(this.masterGain)this.masterGain.gain.value=this.enabled?v:0;if(BGM.audio)BGM.audio.volume=v;},startAmbient(){if(!this.ctx||!this.enabled||this.ambientOsc)return;const o=this.ctx.createOscillator();o.type='sine';o.frequency.value=50;const g=this.ctx.createGain();g.gain.value=0.03;o.connect(g).connect(this._dest());o.start();this.ambientOsc=o;this.ambientGain=g;},stopAmbient(){if(this.ambientOsc){try{this.ambientOsc.stop();}catch(e){}this.ambientOsc=null;this.ambientGain=null;}},startHeartbeat(b){if(!this.ctx||!this.enabled)return;b=b||75;this.stopHeartbeat();const itv=60000/b;const beat=()=>{if(!this.ctx||!this.enabled)return;const t=this.ctx.currentTime;this._thump(t);this._thump(t+0.15);};beat();this.heartbeatTimer=setInterval(beat,itv);},_thump(t){const o=this.ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(30,t+0.15);const g=this.ctx.createGain();g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.connect(g).connect(this._dest());o.start(t);o.stop(t+0.15);},stopHeartbeat(){if(this.heartbeatTimer){clearInterval(this.heartbeatTimer);this.heartbeatTimer=null;}},ding(){if(!this.ctx||!this.enabled)return;const t=this.ctx.currentTime;[1000,1200].forEach((f,i)=>{const o=this.ctx.createOscillator();o.type='sine';o.frequency.value=f;const g=this.ctx.createGain();const tt=t+i*0.12;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(0.15,tt+0.01);g.gain.exponentialRampToValueAtTime(0.001,tt+0.1);o.connect(g).connect(this._dest());o.start(tt);o.stop(tt+0.12);});},metalCreak(){if(!this.ctx||!this.enabled)return;const t=this.ctx.currentTime;const o=this.ctx.createOscillator();o.type='sawtooth';const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.06,t+0.05);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.frequency.setValueAtTime(200,t);for(let i=0;i<10;i++)o.frequency.setValueAtTime(200+Math.random()*200,t+i*0.05);o.connect(g).connect(this._dest());o.start(t);o.stop(t+0.5);},falling(){if(!this.ctx||!this.enabled)return;const t=this.ctx.currentTime;const bs=this.ctx.sampleRate*2;const buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;const n=this.ctx.createBufferSource();n.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2000,t);f.frequency.exponentialRampToValueAtTime(200,t+2);const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+0.2);g.gain.exponentialRampToValueAtTime(0.001,t+2);n.connect(f).connect(g).connect(this._dest());n.start(t);n.stop(t+2);},click(){if(!this.ctx||!this.enabled)return;const t=this.ctx.currentTime;const o=this.ctx.createOscillator();o.type='sine';o.frequency.value=800;const g=this.ctx.createGain();g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.03);o.connect(g).connect(this._dest());o.start(t);o.stop(t+0.04);},toggle(){this.enabled=!this.enabled;if(!this.enabled){this.stopAmbient();this.stopHeartbeat();BGM.stop();if(this.masterGain)this.masterGain.gain.value=0;}else{if(this.masterGain)this.masterGain.gain.value=this.volume;BGM.resume();}return this.enabled;}};

const BGM={
  audio:null,current:null,fadeTimer:null,targetVol:0.4,
  _cache:{},
  _get(track){
    if(!this._cache[track]){
      const a=new window.Audio('audio/'+track+'.mp3');
      a.loop=true;a.preload='auto';a.volume=0;
      this._cache[track]=a;
    }
    return this._cache[track];
  },
  play(track){
    if(this.current===track && this.audio && !this.audio.paused) return;
    this.fadeTo(0,800,()=>{
      if(this.audio){this.audio.pause();}
      this.current=track;
      if(!Audio.enabled) return;
      this.audio=this._get(track);
      this.audio.volume=0;
      this.audio.play().catch(function(){});
      this.targetVol=Audio.volume;
      this.fadeTo(this.targetVol,1500);
    });
  },
  fadeTo(vol,duration,cb){
    if(this.fadeTimer) clearInterval(this.fadeTimer);
    if(!this.audio){ if(cb)cb(); return; }
    const startVol=this.audio.volume;
    const steps=duration/50;
    let step=0;
    this.fadeTimer=setInterval(()=>{
      step++;
      if(this.audio) this.audio.volume=startVol+(vol-startVol)*(step/steps);
      if(step>=steps){
        clearInterval(this.fadeTimer);
        this.fadeTimer=null;
        if(cb) cb();
      }
    },50);
  },
  stop(){
    if(this.fadeTimer){clearInterval(this.fadeTimer);this.fadeTimer=null;}
    if(this.audio){this.audio.pause();this.audio=null;}
    this.current=null;
  },
  resume(){
    if(this.current && this.audio && this.audio.paused){
      this.audio.volume=0;
      this.audio.play().catch(function(){});
      this.fadeTo(this.targetVol,1000);
    } else if(this.current){
      this.audio=this._get(this.current);
      this.audio.volume=0;
      this.audio.play().catch(function(){});
      this.fadeTo(this.targetVol,1000);
    } else {
      this.updateForScene();
    }
  },
  updateForScene(){
    if(!Audio.enabled) return;
    if(State.boyTriggered || State.scene==='boy'){
      this.play('weizhi');
    } else {
      this.play('kunju');
    }
  }
};

function typewriter(text,onDone){
  if(State.typeTimer)clearInterval(State.typeTimer);
  State.typing=true;State.skipRequested=false;State.textComplete=false;State.pendingAdvance=null;
  el.narrative.innerHTML='';
  const p=document.createElement('p');el.narrative.appendChild(p);
  let i=0;
  State.typeTimer=setInterval(()=>{
    if(State.skipRequested){
      text.slice(i).split('').forEach(ch=>{
        if(ch==='\n')p.appendChild(document.createElement('br'));
        else p.appendChild(document.createTextNode(ch));
      });
      finish();
      return;
    }
    if(i<text.length){
      if(text[i]==='\n')p.appendChild(document.createElement('br'));
      else p.appendChild(document.createTextNode(text[i]));
      i++;
    } else finish();
  },55);
  function finish(){
    clearInterval(State.typeTimer);State.typeTimer=null;State.typing=false;
    State.textComplete=true;State.pendingAdvance=onDone;
    showClickHint();
  }
}

/* ========== GAME FLOW ========== */
function pickPanel(){
  const r=Math.random(); let acc=0;
  for(const p of CONFIG.panelTypes){ acc+=p.prob; if(r<acc) return p; }
  return CONFIG.panelTypes[0];
}
function rollBoy(){
  const l=State.loopCount;
  if(l<=10) return false;
  if(l>=31) return true;
  for(const [min,max,prob] of CONFIG.boyTrigger.probTable){ if(l>=min&&l<=max) return Math.random()<prob; }
  return false;
}
function rollNPC(){
  const r=Math.random();
  if(r<0.12) return 'badge';
  if(r<0.19) return 'hooded';
  return 'none';
}
function logDeath(id){ if(id>0){ State.deathLog.add(id); Save.save(); } }
function getLoopIntro(){
  const l=State.loopCount;
  if(l>=4&&l<=6) return CONFIG.loopIntros.r46;
  if(l>=7&&l<=9) return CONFIG.loopIntros.r79;
  if(l>=10&&l<=12) return CONFIG.loopIntros.r1012;
  if(l>=13&&l<=15) return CONFIG.loopIntros.r1315;
  if(l>=16&&l<=18) return CONFIG.loopIntros.r1618;
  if(l>=19&&l<=21) return CONFIG.loopIntros.r1921;
  if(l>=22) return CONFIG.loopIntros.r22;
  return null;
}

/* --- Loop 4+: Normal flow --- */
function startLoop(){
  if(State.loopCount===2){ playLoop2(); return; }
  if(State.loopCount===3){ playLoop3(); return; }
  State.currentFloor=1; State.displayedFloor=null;
  State.heelsIgnored=0; State.wheelchairActive=false;
  State.badgeManEncountered=false; State.badgeForced=false;
  State.break20Presses=0; State._badgeRefuseCount=0;
  State.boyTriggered=rollBoy();
  Save.save(); updateDebug(); updateLoopBar();
  // 少年触发：直接进入演出序列，不进电梯厅
  if(State.boyTriggered){
    BGM.play('weizhi');
    playBoySequence();
    return;
  }
  BGM.updateForScene();
  const intro=getLoopIntro();
  setScene('lobby');
  if(intro){
    typewriter(intro,()=>{
      goToLobby(rollNPC());
    });
  } else {
    goToLobby(rollNPC());
  }
}

/* --- 按面板按钮 --- */
function onPanelButton(btnData,btnEl){
  document.querySelectorAll('.panel-btn').forEach(b=>b.style.pointerEvents='none');
  if(btnData.special==='shock'){
    clearChoices();
    typewriterSeq([
      "指尖一阵发麻。",
      "电流。\n\n从指尖蔓延到手腕，到手臂，到全身。\n\n轿厢的灯管爆闪了几下。",
      "我的身体贴在了面板上，手指像焊死在按键上，想松开却松不开。"
    ],0,()=>die('触电身亡',4));
    return;
  }
  if(btnData.special==='break'){
    clearChoices();
    showChoices([
      {text:'再用力按一次',action:'break20_press'},
      {text:'按别的楼层',action:'break20_other'}
    ]);
    return;
  }
  // 20F: 50%踏空死, 50%随机到其他楼层
  if(btnData.floor===20){
    clearChoices();
    if(Math.random()<0.5){
      // 踏空坠亡
      typewriterSeq([
        "电梯停了。\n\n门开处一片黑暗。",
        "我迈出了电梯。\n\n脚下踩到的不是地砖。\n\n——是虚空。\n\n我坠落了。"
      ],0,()=>die('坠入深渊',1));
    } else {
      // 随机到其他楼层
      const pool=[]; for(let i=1;i<=30;i++) if(i!==20) pool.push(i);
      const target=pool[Math.floor(Math.random()*pool.length)];
      State.displayedFloor=20;
      State.currentFloor=target;
      updateDebug();
      Audio.metalCreak();
      typewriterSeq([
        "我按下20。\n\n电梯开始上升……",
        "叮。门开了。\n\n但走廊的样子……不太对。"
      ],0,()=>arriveAtFloor(target,'elevator'));
    }
    return;
  }
  clearChoices();
  // Determine floor (with displacement)
  let target=btnData.floor;
  let displaced=false;
  if(Math.random()<0.20){
    const pool=[]; for(let i=1;i<=30;i++) if(i!==target) pool.push(i);
    target=pool[Math.floor(Math.random()*pool.length)];
    displaced=true;
  }
  State.displayedFloor=btnData.floor;
  State.currentFloor=target;
  updateDebug();
  // 10% global elevator event
  if(Math.random()<0.10){
    Audio.metalCreak();
    handleElevGlobalEvent();
    return;
  }
  Audio.metalCreak();
  typewriter('电梯开始上升……',()=>arriveAtFloor(target,'elevator'));
}

/* --- 全楼电梯事件 --- */
function handleElevGlobalEvent(){
  const pool=CONFIG.elevatorEvents.filter(e=>e.id!=='E8'&&e.id!=='E9');
  const r=Math.random();
  if(r<0.5){
    const dr=Math.random();
    let evt;
    if(dr<0.55){ evt=pool.find(e=>e.id==='E3'); }
    else if(dr<0.70){ evt=pool.find(e=>e.id==='E1'); }
    else if(dr<0.85){ evt=pool.find(e=>e.id==='E2'); }
    else { evt=pool.find(e=>e.id==='E5'); }
    typewriterSeq(evt.texts,0,()=>die(evt.name,evt.deathId));
  } else if(r<0.75){
    // E8: buttons turn red
    const floors=[]; for(let i=1;i<=30;i++) floors.push(i);
    const target=floors[Math.floor(Math.random()*floors.length)];
    typewriterSeq(CONFIG.elevatorEvents.find(e=>e.id==='E8').texts,0,()=>{
      State.displayedFloor=target; State.currentFloor=target; updateDebug();
      arriveAtFloor(target,'elevator');
    });
  } else {
    // E9: elevator stuck
    typewriterSeq(["电梯猛地一顿。\n\n突然停住了。\n\n显示屏上的数字卡在两层楼之间，不停闪烁。","灯管闪了两下。\n\n轿厢不动了。\n\n我按下开门键。\n\n电梯门纹丝不动。"],0,()=>{
      showChoices([
        {text:'等待',action:'e9_wait'},
        {text:'扒门',action:'e9_pry'}
      ]);
    });
  }
}

/* --- 死亡 --- */
function die(reason,deathId){
  setScene('death'); State.scene='death'; clearChoices();
  const isNew = deathId>0 && !State.deathLog.has(deathId);
  logDeath(deathId);
  Audio.falling();
  document.body.classList.add('dying');

  // Auto-save to auto slot on death
  Save.saveSlot('auto');

  // After death animation, show ceremonial overlay
  setTimeout(()=>{
    document.body.classList.remove('dying');
    showDeathOverlay(reason, deathId, isNew);
  }, 1400);
}

function showDeathOverlay(reason, deathId, isNew){
  const overlay = document.getElementById('death-overlay');
  const deathName = (deathId>0 && CONFIG.deaths[deathId]) ? CONFIG.deaths[deathId] : reason;

  // Build content with staggered animations
  overlay.innerHTML = '';
  const parts = [];

  // Death artwork
  if(deathId>0){
    const art=document.createElement('img');
    art.className='death-art';
    art.src='images/deaths/death_'+String(deathId).padStart(2,'0')+'.webp';
    art.alt=deathName;
    parts.push(art);
  }

  const label = document.createElement('div');
  label.className = 'death-label';
  label.textContent = '—— 你失去了意识 ——';
  parts.push(label);

  const divider = document.createElement('div');
  divider.className = 'death-divider';
  parts.push(divider);

  const name = document.createElement('div');
  name.className = 'death-name';
  name.textContent = deathName;
  parts.push(name);

  const loop = document.createElement('div');
  loop.className = 'death-loop';
  loop.textContent = '循环第 ' + State.loopCount + ' 次';
  parts.push(loop);

  if(isNew){
    const badge = document.createElement('div');
    badge.className = 'unlock-badge';
    badge.textContent = '🔓 解锁新循环 · ' + State.deathLog.size + '/24';
    parts.push(badge);
  } else if(deathId>0){
    const badge = document.createElement('div');
    badge.className = 'death-label';
    badge.style.color = 'var(--text-dim)';
    badge.style.fontSize = '16px';
    badge.textContent = '已收录 · ' + State.deathLog.size + '/24';
    parts.push(badge);
  }

  const btn = document.createElement('button');
  btn.className = 'death-btn';
  btn.textContent = '继续 ▸';
  btn.onclick = function(){
    Audio.click();
    overlay.classList.remove('visible');
    setTimeout(function(){
      overlay.innerHTML = '';
      State.loopCount++; Save.save();
      startLoop();
    }, 300);
  };
  parts.push(btn);

  parts.forEach(function(p){ overlay.appendChild(p); });

  // Reset animation by forcing reflow
  overlay.classList.remove('visible');
  void overlay.offsetHeight;
  overlay.classList.add('visible');
}

/* --- 安全楼层 --- */
function handleSafeFloor(floor){
  State.currentFloor=floor; State.displayedFloor=null;
  updateLoopBar(); updateDebug();
  const choices=[{text:'坐电梯（选楼层）',action:'elevator'}];
  let upFloor=floor+1;
  if(floor===19) upFloor=21;
  if(floor===29){
    typewriter('向上看去，通往30楼的楼梯被一道锈死的铁栅栏锁住了，缝隙里透进来的风带着天台的寒意。',()=>{
      const choices=[{text:'坐电梯（选楼层）',action:'elevator'}];
      choices.push({text:'走楼梯下28F',action:'stairs_down'});
      showChoices(choices);
    });
    return;
  }
  else if(floor<30) choices.push({text:'走楼梯上'+upFloor+'F',action:'stairs_up'});
  let downFloor=floor-1;
  if(floor===21) downFloor=19;
  if(floor>1) choices.push({text:'走楼梯下'+downFloor+'F',action:'stairs_down'});
  showChoices(choices);
}


/* --- 走楼梯 --- */
function takeStairs(direction){
  setScene('stairs'); State.scene='stairs'; clearChoices();
  let from=State.currentFloor;
  let to=direction==='up'?from+1:from-1;
  if(from===19&&direction==='up') to=21;
  if(from===21&&direction==='down') to=19;
  if(from===29&&direction==='up'){ typewriter('向上看去，通往30楼的楼梯被一道锈死的铁栅栏锁住了，缝隙里透进来的风带着天台的寒意。\n\n上不去。',()=>handleSafeFloor(29)); return; }
  if((from===19&&to===21)||(from===21&&to===19)){
    if(Math.random()<0.30){
      typewriterSeq([
        "台阶上的数字在重复。\n\n4、4、4。",
        "不管我爬多少层，标识牌上的数字永远是4。",
        "我跑不动了。"
      ],0,()=>die('鬼打墙',10));
      return;
    }
  }
  if(Math.random()<0.15){
    const evt=CONFIG.stairsEvents[Math.floor(Math.random()*CONFIG.stairsEvents.length)];
    typewriterSeq(evt.texts,0,()=>die(evt.name,evt.deathId));

  }
  typewriter('我推开防火门，走向'+to+'F。',()=>arriveAtFloor(to,'stairs'));
}

/* --- 少年演出序列 --- */
function playBoySequence(){
  State.scene='boy'; clearChoices();
  const seq=CONFIG.boyTrigger.sequence;
  let idx=0;
  // Scene mapping for 14 segments:
  // 0-1: elevator, 2-7: elevator (4F events), 8-9: stairs (escape+heels), 10-12: stairs/black (chase), 13: black/boy (caught)
  const scenes=['elevator','elevator','elevator','elevator','elevator','elevator','elevator','elevator','stairs','stairs','stairs','stairs','black','black'];
  function nextSeg(){
    if(idx>=seq.length){ showEndScreen(); return; }
    setScene(scenes[idx]||'black');
    if(idx===2) Audio.ding();
    if(idx===7) Audio.metalCreak();
    if(idx===9) Audio.startHeartbeat(110);
    if(idx===13) Audio.boyEntrance&&Audio.boyEntrance();
    typewriter(seq[idx],()=>{ idx++; nextSeg(); });
  }
  nextSeg();
}

function showEndScreen(){
  setScene('boy');
  clearChoices(); el.narrative.innerHTML='';

  typewriterSeq(CONFIG.boyTrigger.endSequence,0,()=>{

    setTimeout(function(){ showSettlement(); }, 2000);
  });
}

          "在门即将关闭的瞬间，我好像看到——高跟鞋动了一下。",
          "不，是风吹的。\n\n一定是风。"
        ],0,()=>{
          const panel=pickPanel(); State.currentPanel=panel;
          typewriter(panel.desc,()=>renderPanel(panel));
        });
      }
      break;
    case 'heels_take':
      typewriterSeq([
        "我弯腰捡起了那只高跟鞋。\n\n红色。很漂亮。\n\n拿在手里很轻，皮面光滑得像没有重量。\n\n看起来很贵。\n\n我能想象它穿在脚上的样子——一定很美。",
        "突然，我感觉脚有点勒。\n\n低头一看——\n\n我的手上空空如也，而脚上不知何时穿上了一双红色的高跟鞋。\n\n鲜红欲滴。\n\n我惊恐地想要把它脱下来，它却像焊在我脚上一样，怎么都脱不下来……"
      ],0,()=>die('高跟鞋的喜爱',20));
      break;
    case 'heels_exit': 
      typewriterSeq([
        "我绕过那只高跟鞋，快步走向楼梯间。"
      ],0,()=>takeStairs('up')); 
      break;
    // E9: elevator stuck
    case 'e9_wait':
      if(Math.random()<0.5){
        typewriterSeq([
          "我决定留在电梯里等待。\n\n电梯故障的时候，切莫自乱阵脚。\n\n也许是临时故障，一会儿就好了。",
          "一分钟过去了。\n\n两分钟过去了。\n\n灯管开始发出电流的嗡鸣声。\n\n越来越刺耳。",
          "然后——\n\n一声闷响。\n\n电梯抖了一下。\n\n失重感从脚底窜上来。",
          "我的身体飘了起来。\n\n灯管在闪烁，轿厢在自由落体。\n\n胃像被一只手攥住。\n\n我想抓住扶手，但手指抓空了。",
          "撞击地面的那一瞬间，我什么都听不见了。"
        ],0,()=>die('电梯坠落',6));
      } else {
        typewriterSeq([
          "我决定留在电梯里等待。\n\n电梯故障的时候，切莫自乱阵脚。\n\n也许是临时故障，一会儿就好了。",
          "一分钟过去了。\n\n两分钟过去了。\n\n灯管开始发出电流的嗡鸣声。\n\n越来越刺耳。",
          "然后——\n\n电梯动了。\n\n在往上走。\n\n越来越快。",
          "不是正常的加速——是那种钢缆断裂、制动失灵的疯狂加速。\n\n我被甩到了地板上。\n\n显示屏上的数字在跳，快到来不及看清。",
          "头顶的楼板越来越近。\n\n30层的天花板。\n\n撞击。"
        ],0,()=>die('电梯冲顶',5));
      }
      break;
    case 'e9_pry':
      if(Math.random()<0.60){
        typewriterSeq([
          "不行，不能坐以待毙。\n\n我把手指塞进门缝。\n\n用力扒，门缓缓被我撑开一条缝。\n\n冷风从缝隙灌进来。",
          "我侧着身子往外挤。\n\n半边身子出去了。\n\n另一半还在轿厢里。",
          "就在这时——\n\n电梯动了。\n\n糟糕！",
          "门，夹住了我的腰。\n\n电梯开始上升。\n\n我被夹在门和门框之间，跟着轿厢一起往上走。\n\n不要！"
        ],0,()=>die('电梯门剪切',7));
      } else {
        typewriterSeq([
          "不行，不能坐以待毙。\n\n我把手指塞进门缝。\n\n用力扒，门缓缓被我撑开一条缝。\n\n冷风从缝隙灌进来。",
          "我侧着身子挤了出去。\n\n脚踩在了下一层楼的走廊地板上。",
          "身后，电梯门缓缓合拢。\n\n轿厢开始自行运行，向下沉去。\n\n越来越远。"
        ],0,()=>{
          var f=State.currentFloor||2;
          arriveAtFloor(f,'stairs');
        });
      }
      break;
    default: console.warn('Unknown action:',a);
  }
}

/* ========== INIT ========== */
function showTitleScreen(){
  setScene('title');
  BGM.play('kunju');
  document.getElementById('menu-btn').style.display='none';
}

/* --- 菜单功能 --- */
function toggleMenu(){
  const panel=document.getElementById('menu-panel');
  panel.classList.toggle('visible');
  if(panel.classList.contains('visible')) updateMenu();
}
function updateMenu(){
  document.getElementById('menu-loop').textContent=State.loopCount;
  const audioBtn=document.getElementById('menu-audio-toggle');
  audioBtn.textContent=Audio.enabled?'🔊 音效开启':'🔇 音效关闭';
}
function returnToTitle(){
  document.getElementById('menu-panel').classList.remove('visible');
  Save.save();
  BGM.play('kunju');
  document.getElementById('title-screen').classList.remove('hidden');
  setScene('title');
}
function confirmReset(){
  document.getElementById('menu-panel').classList.remove('visible');
  clearChoices();
  el.narrative.innerHTML='';
  typewriter('确定要重置存档吗？所有进度将丢失。',()=>{
    showChoices([
      {text:'确认重置',action:'_confirm_reset'},
      {text:'取消',action:'_cancel_reset'}
    ]);
  });
}
function toggleAudioFromMenu(){
  if(!Audio.ctx) Audio.init();
  const e=Audio.toggle();
  if(e){BGM.resume();}else{BGM.stop();}
  updateMenu();
  if(e&&Audio.ctx){ const c=SCENE_CFG[State.scene]||{}; if(c.ambient)Audio.startAmbient(); if(c.heartbeat)Audio.startHeartbeat(c.heartbeat); }
}
function setVolume(v){
  v=v/100;
  if(!Audio.ctx) Audio.init();
  Audio.setVolume(v);
}

document.getElementById('start-btn').addEventListener('click',()=>{
  Audio.init(); Audio.click(); Audio.startAmbient();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('menu-btn').style.display='block';
  setTimeout(()=>startGame(),600);
});
document.getElementById('codex-btn-title').addEventListener('click',()=>{
  Audio.click(); Save.load(); showDeathCodex();
});
document.getElementById('codex-close').addEventListener('click',()=>{
  Audio.click(); hideDeathCodex();
});
document.getElementById('save-close').addEventListener('click',()=>{
  Audio.click(); hideSavePanel();
});
document.getElementById('settlement-save-btn').addEventListener('click',()=>{
  Audio.click(); saveSettlement();
});
document.getElementById('settlement-continue-btn').addEventListener('click',()=>{
  Audio.click();
  var btn=document.getElementById('settlement-continue-btn');
  if(btn.dataset.confirmed){
    Save.reset(); location.reload();
  } else {
    btn.dataset.confirmed='1';
    btn.textContent='确认清除并重新开始';
    btn.style.borderColor='var(--blood)';
    btn.style.color='var(--blood-bright)';
  }
});
document.getElementById('menu-btn').addEventListener('click',(e)=>{
  e.stopPropagation();
  toggleMenu();
});
document.addEventListener('click',(e)=>{
  // Close menu when clicking outside
  if(!e.target.closest('#menu-panel')&&!e.target.closest('#menu-btn')){
    document.getElementById('menu-panel').classList.remove('visible');
  }
});

/* ========== DEBUG ========== */
const DBG={
  forceBoy(){ document.getElementById('menu-panel').classList.remove('visible'); State.boyTriggered=true; typewriter('[DEBUG] 少年触发已强制。下次进电梯将触发。',()=>{}); },
  skipTo31(){ document.getElementById('menu-panel').classList.remove('visible'); State.loopCount=31; Save.save(); typewriter('[DEBUG] 已跳到循环31。下次失去意识后触发。',()=>{}); },
  resetSave(){ Save.reset(); location.reload(); },
  showDeathPicker(){
    document.getElementById('menu-panel').classList.remove('visible');
    clearChoices();
    el.narrative.innerHTML='';
    typewriter('[DEBUG] 选择要触发的死法：',()=>{
      const deaths=CONFIG.deaths;
      const choices=[];
      for(const id in deaths){
        if(deaths.hasOwnProperty(id)){
          choices.push({text:'#'+id+' '+deaths[id],action:'_debug_death_'+id});
        }
      }
      choices.push({text:'取消',action:'_debug_cancel'});
      showChoices(choices);
    });
  },
  triggerDeath(id){
    clearChoices();
    el.narrative.innerHTML='';
    const name=CONFIG.deaths[id]||'未知';
    typewriter('[DEBUG] 触发：#'+id+' '+name,()=>{
      die(name,parseInt(id));
    });
  }
};

/* --- 循环图鉴 --- */
function showDeathCodex(){
  const overlay=document.getElementById('codex-overlay');
  const grid=document.getElementById('codex-grid');
  const progress=document.getElementById('codex-progress');
  grid.innerHTML='';
  const unlocked=State.deathLog.size;
  progress.textContent=unlocked+' / 24';
  for(let i=1;i<=24;i++){
    const cell=document.createElement('div');
    const isUnlocked=State.deathLog.has(i);
    cell.className='codex-cell '+(isUnlocked?'unlocked':'locked');
    if(isUnlocked){
      cell.style.backgroundImage="url('images/deaths/death_"+String(i).padStart(2,'0')+".webp')";
      const ov=document.createElement('div'); ov.className='cell-overlay'; cell.appendChild(ov);
    }
    const num=document.createElement('div');
    num.className='cell-num';
    num.textContent=String(i).padStart(2,'0');
    const name=document.createElement('div');
    name.className='cell-name';
    name.textContent=isUnlocked?CONFIG.deaths[i]:'？';
    cell.appendChild(num);
    cell.appendChild(name);
    grid.appendChild(cell);
  }
  overlay.classList.add('visible');
}
function hideDeathCodex(){
  document.getElementById('codex-overlay').classList.remove('visible');
}

/* --- 结算页面 --- */
function showSettlement(){
  var overlay=document.getElementById('settlement-overlay');
  var grid=document.getElementById('settlement-grid');
  var count=document.getElementById('settlement-count');
  var unlocked=State.deathLog.size;
  count.textContent=unlocked;
  grid.innerHTML='';
  for(var i=1;i<=24;i++){
    var cell=document.createElement('div');
    var isUnlocked=State.deathLog.has(i);
    cell.className='codex-cell '+(isUnlocked?'unlocked':'locked');
    if(isUnlocked){
      cell.style.backgroundImage="url('images/deaths/death_"+String(i).padStart(2,'0')+".webp')";
      var ov=document.createElement('div'); ov.className='cell-overlay'; cell.appendChild(ov);
    }
    var num=document.createElement('div');
    num.className='cell-num';
    num.textContent=String(i).padStart(2,'0');
    var name=document.createElement('div');
    name.className='cell-name';
    name.textContent=isUnlocked?CONFIG.deaths[i]:'？';
    cell.appendChild(num);
    cell.appendChild(name);
    grid.appendChild(cell);
  }
  overlay.classList.add('visible');
}
function saveSettlement(){
  var btn=document.getElementById('settlement-save-btn');
  var originalText=btn.textContent;
  btn.textContent='生成中...'; btn.disabled=true;
  var target=document.getElementById('settlement-content');
  if(typeof html2canvas==='undefined'){
    btn.textContent='截图库未加载'; 
    setTimeout(function(){btn.textContent=originalText;btn.disabled=false;},2000);
    return;
  }
  html2canvas(target,{
    backgroundColor:'#0f0f14',
    scale:2,
    useCORS:true,
    allowTaint:true
  }).then(function(canvas){
    var link=document.createElement('a');
    link.download='大楼-循环图鉴-'+State.deathLog.size+'of24.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    btn.textContent='已保存 ✓';
    setTimeout(function(){btn.textContent=originalText;btn.disabled=false;},2000);
  }).catch(function(){
    btn.textContent='保存失败';
    setTimeout(function(){btn.textContent=originalText;btn.disabled=false;},2000);
  });
}

/* --- 存档/读档面板 --- */
function showSavePanel(){
  document.getElementById('menu-panel').classList.remove('visible');
  const overlay=document.getElementById('save-overlay');
  const container=document.getElementById('save-slots');
  const slots=Save.getSlots();
  const slotDefs=[
    {key:'auto',label:'自动存档'},
    {key:'slot1',label:'存档位 1'},
    {key:'slot2',label:'存档位 2'},
    {key:'slot3',label:'存档位 3'}
  ];
  container.innerHTML='';
  slotDefs.forEach(def=>{
    const data=slots[def.key];
    const slot=document.createElement('div');
    slot.className='save-slot '+(data?'':'empty');
    let html='<div class="save-slot-info">';
    html+='<div class="save-slot-name">'+def.label+'</div>';
    if(data){
      html+='<div class="save-slot-detail">循环第 '+data.loopCount+' 次 · 循环 '+data.deathLog.length+'/24 · '+data.time+'</div>';
    } else {
      html+='<div class="save-slot-detail">— 空 —</div>';
    }
    html+='</div>';
    html+='<div class="save-slot-actions">';
    if(def.key!=='auto'){
      html+='<button class="save-slot-btn" onclick="saveToSlot(\''+def.key+'\')">💾 保存</button>';
    } else {
      html+='<div style="font-size:14px;color:var(--text-dim);padding:6px 0;">游戏自动保存</div>';
    }
    if(data){
      html+='<button class="save-slot-btn" onclick="loadFromSlot(\''+def.key+'\')">📖 读取</button>';
      if(def.key!=='auto'){
        html+='<button class="save-slot-btn danger" onclick="deleteSlot(\''+def.key+'\')">✕ 删除</button>';
      }
    }
    html+='</div>';
    slot.innerHTML=html;
    container.appendChild(slot);
  });
  overlay.classList.add('visible');
}
function hideSavePanel(){
  document.getElementById('save-overlay').classList.remove('visible');
}
function saveToSlot(key){
  Save.saveSlot(key);
  Audio.click();
  showSavePanel();
}
function loadFromSlot(key){
  Audio.click();
  if(Save.loadSlot(key)){
    hideSavePanel();
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('menu-btn').style.display='block';
    startGame();
  }
}
function deleteSlot(key){
  Save.deleteSlot(key);
  Audio.click();
  showSavePanel();
}

// Handle reset confirmation and debug choices
const _origHandleChoice = handleChoice;
handleChoice = function(c){
  if(c.action==='_confirm_reset'){ clearChoices(); typewriter('存档已清除。',()=>{ Save.reset(); location.reload(); }); return; }
  if(c.action==='_cancel_reset'){ clearChoices(); el.narrative.innerHTML=''; startLoop(); return; }
  if(c.action==='_debug_cancel'){ clearChoices(); el.narrative.innerHTML=''; startLoop(); return; }
  if(c.action && c.action.startsWith('_debug_death_')){
    const id=c.action.replace('_debug_death_','');
    DBG.triggerDeath(parseInt(id));
    return;
  }
  _origHandleChoice(c);
};

showTitleScreen();
